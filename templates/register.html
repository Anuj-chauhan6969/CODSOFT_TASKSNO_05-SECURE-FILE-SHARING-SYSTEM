<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
</head>

<body>

<h1>Create Account</h1>

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        minlength="8"
        required
    >

    <button type="submit">
        Register
    </button>

</form>

<a href="/login">
    Login
</a>

</body>
</html>
