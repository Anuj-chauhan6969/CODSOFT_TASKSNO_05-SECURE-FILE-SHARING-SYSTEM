<!DOCTYPE html>
<html>
<head>
    <title>Secure File Sharing</title>
</head>

<body>

<h1>Secure File Sharing</h1>

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<a href="/register">
    Create Account
</a>

</body>
</html>
